<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzVXFCB8u5iN9jIFD7rVJJJCed7T7lkp8",
  authDomain: "food-delivery-fb89e.firebaseapp.com",
  projectId: "food-delivery-fb89e",
  storageBucket: "food-delivery-fb89e.firebasestorage.app",
  messagingSenderId: "1050430398596",
  appId: "1:1050430398596:web:1701ff1d161183105e22d1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let items = [];
let currentDate = new Date();
let selectedDate = null;
let weeklyChart = null;
let monthlyChart = null;

function showLoading() {
  document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading() {
  document.getElementById("loadingOverlay").style.display = "none";
}

function setStatus(text) {
  document.getElementById("syncStatus").textContent = text;
}

function formatDateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("Preencha email e senha!");
    return;
  }

  showLoading();

  try {
    await auth.signInWithEmailAndPassword(email, password);
    alert("✅ Login realizado!");
  } catch (error) {
    alert("❌ Erro: " + error.message);
  } finally {
    hideLoading();
  }
}

async function signup() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  if (!email || !password || password.length < 6) {
    alert("Email e senha com mínimo de 6 caracteres.");
    return;
  }

  showLoading();

  try {
    await auth.createUserWithEmailAndPassword(email, password);
    alert("✅ Conta criada!");
  } catch (error) {
    alert("❌ Erro: " + error.message);
  } finally {
    hideLoading();
  }
}

async function logout() {
  await auth.signOut();
}

async function loadUserData(uid) {
  showLoading();
  setStatus("🔄 Carregando dados...");

  try {
    const doc = await db.collection("users").doc(uid).get();

    if (doc.exists) {
      items = doc.data().items || [];
      setStatus("✅ Dados carregados");
    } else {
      items = [];
      setStatus("✅ Pronto para salvar");
    }

    renderCalendar();
    updateCharts();
    updateDayItemsList();
  } catch (error) {
    console.error(error);
    setStatus("⚠️ Erro ao carregar: " + error.message);
  } finally {
    hideLoading();
  }
}

async function saveToCloud() {
  if (!currentUser) return;

  setStatus("🔄 Salvando...");

  try {
    await db.collection("users").doc(currentUser.uid).set({
      items: items,
      lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    });

    setStatus("✅ Sincronizado");
  } catch (error) {
    console.error(error);
    setStatus("⚠️ Erro ao salvar: " + error.message);
  }
}

function saveData() {
  localStorage.setItem("dinheiroEmDiaBackup", JSON.stringify(items));

  renderCalendar();
  updateCharts();
  updateDayItemsList();

  if (currentUser) {
    saveToCloud();
  }
}

function getItemsForDate(date) {
  const dateKey = formatDateKey(date);
  const dayOfWeek = date.getDay();
  const dayOfMonth = date.getDate();

  return items.filter(item => {
    if (item.recurrence === "unique") return item.date === dateKey;
    if (item.recurrence === "weekly") return item.dayOfWeek === dayOfWeek;
    if (item.recurrence === "monthly") return item.dayOfMonth === dayOfMonth;
    return false;
  });
}

function getWeekBalance(date) {
  const start = new Date(date);
  start.setDate(date.getDate() - date.getDay());

  let income = 0;
  let expense = 0;

  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);

    getItemsForDate(d).forEach(item => {
      if (item.type === "income") income += item.amount || 0;
      if (item.type === "expense") expense += item.amount || 0;
    });
  }

  return income - expense;
}

function getMonthBalance(date) {
  const year = date.getFullYear();
  const month = date.getMonth();

  let income = 0;
  let expense = 0;

  for (let day = 1; day <= 31; day++) {
    const d = new Date(year, month, day);
    if (d.getMonth() !== month) break;

    getItemsForDate(d).forEach(item => {
      if (item.type === "income") income += item.amount || 0;
      if (item.type === "expense") expense += item.amount || 0;
    });
  }

  return income - expense;
}

function getLast4WeeksBalances() {
  const today = new Date();
  const balances = [];
  const weekLabels = [];

  for (let i = 3; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i * 7);

    const start = new Date(d);
    start.setDate(d.getDate() - d.getDay());

    balances.push(getWeekBalance(d));
    weekLabels.push(`${start.getDate()}/${start.getMonth() + 1}`);
  }

  return { balances, weekLabels };
}

function getLast6MonthsBalances() {
  const today = new Date();
  const balances = [];
  const monthLabels = [];

  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    balances.push(getMonthBalance(d));
    monthLabels.push(d.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }));
  }

  return { balances, monthLabels };
}

function updateCharts() {
  const weekBalance = getWeekBalance(new Date());
  const monthBalance = getMonthBalance(new Date());

  document.getElementById("weekBalanceValue").innerHTML =
    `<div class="${weekBalance >= 0 ? "balance-positive" : "balance-negative"}">R$ ${weekBalance.toFixed(2)}</div>`;

  document.getElementById("monthBalanceValue").innerHTML =
    `<div class="${monthBalance >= 0 ? "balance-positive" : "balance-negative"}">R$ ${monthBalance.toFixed(2)}</div>`;

  document.getElementById("weeklyAlert").innerHTML =
    weekBalance < 0 ? `<div class="alert">⚠️ Semana negativa</div>` : "";

  document.getElementById("monthlyAlert").innerHTML =
    monthBalance < 0 ? `<div class="alert">⚠️ Mês negativo</div>` : "";

  const weeklyData = getLast4WeeksBalances();
  const monthlyData = getLast6MonthsBalances();

  if (weeklyChart) weeklyChart.destroy();
  if (monthlyChart) monthlyChart.destroy();

  weeklyChart = new Chart(document.getElementById("weeklyChart"), {
    type: "bar",
    data: {
      labels: weeklyData.weekLabels,
      datasets: [{
        label: "Saldo semanal",
        data: weeklyData.balances
      }]
    }
  });

  monthlyChart = new Chart(document.getElementById("monthlyChart"), {
    type: "line",
    data: {
      labels: monthlyData.monthLabels,
      datasets: [{
        label: "Saldo mensal",
        data: monthlyData.balances
      }]
    }
  });
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("currentMonth").textContent =
    currentDate.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  const grid = document.getElementById("calendarGrid");

  grid.innerHTML = `
    <div class="weekday">Dom</div>
    <div class="weekday">Seg</div>
    <div class="weekday">Ter</div>
    <div class="weekday">Qua</div>
    <div class="weekday">Qui</div>
    <div class="weekday">Sex</div>
    <div class="weekday">Sáb</div>
  `;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  for (let i = 0; i < firstDay.getDay(); i++) {
    const empty = document.createElement("div");
    empty.className = "calendar-day";
    empty.style.opacity = "0.3";
    grid.appendChild(empty);
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(year, month, day);
    const dayItems = getItemsForDate(date);

    const div = document.createElement("div");
    div.className = "calendar-day";

    const today = new Date();
    if (
      date.getDate() === today.getDate() &&
      date.getMonth() === today.getMonth() &&
      date.getFullYear() === today.getFullYear()
    ) {
      div.classList.add("today");
    }

    let html = `<div class="day-number">${day}</div>`;

    dayItems.slice(0, 4).forEach(item => {
      if (item.type === "expense") html += `<div class="day-expense">🔴 ${item.title}: R$ ${item.amount.toFixed(2)}</div>`;
      if (item.type === "income") html += `<div class="day-income">🟢 ${item.title}: R$ ${item.amount.toFixed(2)}</div>`;
      if (item.type === "appointment") html += `<div class="day-appointment">📅 ${item.title}</div>`;
      if (item.type === "note") html += `<div class="day-note">📝 ${item.title}</div>`;
    });

    div.innerHTML = html;
    div.onclick = () => openModal(date);

    grid.appendChild(div);
  }
}

function openModal(date) {
  selectedDate = new Date(date);
  document.getElementById("modalDate").textContent = selectedDate.toLocaleDateString("pt-BR");
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  updateDayItemsList();
}

function updateDayItemsList() {
  const list = document.getElementById("dayItemsList");
  const display = document.getElementById("selectedDateDisplay");

  if (!selectedDate) {
    display.innerHTML = "";
    list.innerHTML = `<p style="text-align:center;color:#94a3b8;">Clique em um dia</p>`;
    return;
  }

  display.innerHTML = `<div class="selected-date">${selectedDate.toLocaleDateString("pt-BR")}</div>`;

  const dayItems = getItemsForDate(selectedDate);

  if (dayItems.length === 0) {
    list.innerHTML = `<p style="text-align:center;color:#94a3b8;">Nenhum item neste dia</p>`;
    return;
  }

  list.innerHTML = "";

  dayItems.forEach(item => {
    const index = items.findIndex(i => i.id === item.id);

    const div = document.createElement("div");
    div.className = `item-card ${item.type}`;

    div.innerHTML = `
      <div class="item-info">
        <div class="item-title">${item.title}</div>
        <div class="item-details">${item.amount ? "R$ " + item.amount.toFixed(2) : item.time || item.content || ""}</div>
      </div>
      <div>
        <button class="delete-btn" onclick="deleteItem(${index})">Excluir</button>
      </div>
    `;

    list.appendChild(div);
  });
}

function deleteItem(index) {
  if (index < 0) return;

  if (confirm("Deseja excluir?")) {
    items.splice(index, 1);
    saveData();
  }
}

function openGoogleMaps() {
  const loc = document.getElementById("appointmentLocation").value;
  if (loc) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`, "_blank");
  }
}

document.getElementById("financialForm").addEventListener("submit", e => {
  e.preventDefault();

  const recurrence = document.getElementById("recurrence").value;

  const item = {
    id: Date.now(),
    type: document.getElementById("type").value,
    title: document.getElementById("description").value,
    amount: parseFloat(document.getElementById("amount").value),
    recurrence,
    date: formatDateKey(selectedDate)
  };

  if (recurrence === "weekly") item.dayOfWeek = parseInt(document.getElementById("dayOfWeek").value);
  if (recurrence === "monthly") item.dayOfMonth = parseInt(document.getElementById("dayOfMonth").value);

  items.push(item);
  e.target.reset();
  saveData();
  closeModal();
});

document.getElementById("appointmentForm").addEventListener("submit", e => {
  e.preventDefault();

  const recurrence = document.getElementById("appointmentRecurrence").value;

  const item = {
    id: Date.now(),
    type: "appointment",
    title: document.getElementById("appointmentTitle").value,
    time: document.getElementById("appointmentTime").value,
    location: document.getElementById("appointmentLocation").value,
    description: document.getElementById("appointmentDescription").value,
    recurrence,
    date: formatDateKey(selectedDate)
  };

  if (recurrence === "weekly") item.dayOfWeek = selectedDate.getDay();
  if (recurrence === "monthly") item.dayOfMonth = selectedDate.getDate();

  items.push(item);
  e.target.reset();
  saveData();
  closeModal();
});

document.getElementById("noteForm").addEventListener("submit", e => {
  e.preventDefault();

  items.push({
    id: Date.now(),
    type: "note",
    title: document.getElementById("noteTitle").value,
    content: document.getElementById("noteContent").value,
    color: document.getElementById("noteColor").value,
    recurrence: "unique",
    date: formatDateKey(selectedDate)
  });

  e.target.reset();
  saveData();
  closeModal();
});

document.getElementById("recurrence").addEventListener("change", e => {
  document.getElementById("dayOfWeekGroup").style.display = e.target.value === "weekly" ? "block" : "none";
  document.getElementById("dayOfMonthGroup").style.display = e.target.value === "monthly" ? "block" : "none";
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

    this.classList.add("active");
    document.getElementById(this.dataset.tab + "Tab").classList.add("active");
  });
});

document.getElementById("prevMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
};

document.getElementById("nextMonth").onclick = () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
};

function generateWeeklyReport() {
  document.getElementById("reportContent").innerHTML =
    `<h4>Relatório semanal</h4><p>Saldo: R$ ${getWeekBalance(new Date()).toFixed(2)}</p>`;
}

function generateMonthlyReport() {
  document.getElementById("reportContent").innerHTML =
    `<h4>Relatório mensal</h4><p>Saldo: R$ ${getMonthBalance(new Date()).toFixed(2)}</p>`;
}

function generateComparisonReport() {
  document.getElementById("reportContent").innerHTML =
    `<h4>Comparativo</h4><p>Veja os gráficos acima.</p>`;
}

function sendNotification() {
  alert("Função de WhatsApp depois ajustamos.");
}

function scheduleNotification() {
  alert("Agendamento salvo localmente.");
}

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;

    document.getElementById("authSection").style.display = "none";
    document.getElementById("userInfo").style.display = "flex";
    document.getElementById("userEmail").textContent = user.email;

    await loadUserData(user.uid);
  } else {
    currentUser = null;

    document.getElementById("authSection").style.display = "flex";
    document.getElementById("userInfo").style.display = "none";

    const backup = localStorage.getItem("dinheiroEmDiaBackup");
    items = backup ? JSON.parse(backup) : [];

    setStatus("🔓 Faça login para salvar na nuvem");

    renderCalendar();
    updateCharts();
    updateDayItemsList();
  }
});

window.login = login;
window.signup = signup;
window.logout = logout;
window.closeModal = closeModal;
window.openGoogleMaps = openGoogleMaps;
window.deleteItem = deleteItem;
window.generateWeeklyReport = generateWeeklyReport;
window.generateMonthlyReport = generateMonthlyReport;
window.generateComparisonReport = generateComparisonReport;
window.sendNotification = sendNotification;
window.scheduleNotification = scheduleNotification;
</script>
